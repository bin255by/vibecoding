<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>knilch作品集</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-brand">knilch</div>
        <div class="nav-right">
            <a href="#about" data-i18n="navAbout">About</a>
            <a href="#projects" data-i18n="navProjects">Projects</a>
            <a href="#contact" data-i18n="navContact">Contact</a>
            <select class="lang-select" id="langSelect">
                <option value="en">English</option>
                <option value="zh" selected>中文</option>
                <!-- <option value="ja">日本語</option> -->
            </select>
        </div>
    </nav>

    <!-- Hero 区域 -->
    <div class="hero">
        <h1 data-i18n="heroTitle">Welcome to my portfolio</h1>
        <p data-i18n="heroSub1">IT Support / Junior Cloud Engineer</p>
        <p data-i18n="heroSub2">Building real-world systems with AWS & Linux</p>
    </div>

    <!-- About 部分 -->
    <section id="about">
        <h2 data-i18n="aboutHeading">About</h2>
        <div class="aboutText" id="aboutText-container"></div>
    </section>

    <!-- Skills 部分 -->
    <section>
        <h2 data-i18n="skillsHeading">Skills</h2>
        <div class="skills" id="skills-container"></div>

    </section>

    <!-- Projects 部分 -->
    <section id="projects">
    <h2 data-i18n="projectsHeading">Projects</h2>
    <div id="projects-container"></div>
</section>

    <!-- Contact 部分 -->
    <section id="contact">
        <h2 data-i18n="contactHeading">Contact</h2>
        <p data-i18n="contactText">Email: </p>
        <p>bin255by@outlook.com</p>

    </section>

    <!-- Footer 部分 -->
    <footer>
        <p>© 2026 knilch</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
